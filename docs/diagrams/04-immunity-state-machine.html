<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máy Trạng thái Quản trị Miễn dịch 4 Lớp — MoMo TrustLoop v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap&subset=vietnamese" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f6f6f8;
      --color-paper-2: #ffffff;
      --color-ink:     #111a4a;
      --color-muted:   #5b5e68;
      --color-soft:    #3b3e47;
      --color-accent:  #c2410c;
      --color-link:    #0b57d0;
      --font-sans:     'Be Vietnam Pro', system-ui, sans-serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.2vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">STATE MACHINE · 4-LAYER IMMUNITY GOVERNANCE</p>
    <h1>Vòng đời Chỉ báo Miễn dịch 4 Lớp (Maker–Checker &amp; Khiếu nại)</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-immunity-title state-immunity-desc">
        <title id="state-immunity-title">Máy Trạng thái Quản trị Miễn dịch 4 Lớp</title>
        <desc id="state-immunity-desc">Vòng đời 5 trạng thái chuẩn của Chỉ báo Miễn dịch: Cảnh báo mềm, Chờ Checker duyệt, Hiệu lực B2C, Hết hạn và Đã thu hồi sau Khiếu nại.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#5b5e68"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#c2410c"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#0b57d0"/>
          </marker>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(17,26,74,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f6f6f8"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- TRANSITIONS (orthogonal, drawn before states) -->
        <!-- Start dot (56,164) -> SOFT_WARNING (100,164) -->
        <line x1="64" y1="164" x2="100" y2="164" stroke="#111a4a" stroke-width="1.3" marker-end="url(#arrow)"/>

        <!-- SOFT_WARNING (292,164) -> PENDING_CHECKER (376,164) -->
        <line x1="292" y1="164" x2="376" y2="164" stroke="#5b5e68" stroke-width="1.3" marker-end="url(#arrow)"/>
        <rect x="296" y="138" width="76" height="14" rx="2" fill="#f6f6f8"/>
        <text x="334" y="148" fill="#5b5e68" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">ĐỀ XUẤT [≥2 NGUỒN]</text>

        <!-- PENDING_CHECKER (572,164) -> ACTIVE (668,164) -->
        <line x1="572" y1="164" x2="668" y2="164" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
        <rect x="576" y="138" width="88" height="14" rx="2" fill="#f6f6f8"/>
        <text x="620" y="148" fill="#c2410c" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">DUYỆT [CHẶN 403/400]</text>

        <!-- SOFT_WARNING (196,204) -> EXPIRED (376,352) -->
        <path d="M 196,204 V 344 Q 196,352 204,352 H 376" fill="none" stroke="#5b5e68" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="212" y="336" width="84" height="14" rx="2" fill="#f6f6f8"/>
        <text x="254" y="346" fill="#5b5e68" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">HẾT HẠN (72H)</text>

        <!-- ACTIVE (696,204) -> EXPIRED (572,352) -->
        <path d="M 696,204 V 344 Q 696,352 688,352 H 572" fill="none" stroke="#5b5e68" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="588" y="336" width="92" height="14" rx="2" fill="#f6f6f8"/>
        <text x="634" y="346" fill="#5b5e68" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">HẾT HẠN (72H/30D)</text>

        <!-- ACTIVE (784,204) -> ROLLED_BACK (784,316) -->
        <line x1="784" y1="204" x2="784" y2="316" stroke="#0b57d0" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="708" y="252" width="152" height="14" rx="2" fill="#f6f6f8"/>
        <text x="784" y="262" fill="#0b57d0" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">KHIẾU NẠI → CHECKER KHÁC THU HỒI</text>

        <!-- EXPIRED (474,388) -> End dot (632,444) -->
        <path d="M 474,388 V 436 Q 474,444 482,444 H 616" fill="none" stroke="#5b5e68" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- ROLLED_BACK (784,388) -> End dot (632,444) -->
        <path d="M 784,388 V 436 Q 784,444 776,444 H 648" fill="none" stroke="#5b5e68" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- START & END SYMBOLS -->
        <circle cx="56" cy="164" r="6" fill="#111a4a"/>
        <circle cx="632" cy="444" r="8" fill="none" stroke="#111a4a" stroke-width="1.5"/>
        <circle cx="632" cy="444" r="5" fill="#111a4a"/>

        <!-- STATES (5 canonical IMMUNITY_STATUSES) -->
        <!-- SOFT_WARNING -->
        <g>
          <rect x="100" y="124" width="192" height="80" rx="8" fill="#f6f6f8"/>
          <rect x="100" y="124" width="192" height="80" rx="8" fill="#ffffff" stroke="#111a4a" stroke-width="1.2"/>
          <rect x="112" y="134" width="48" height="14" rx="2" fill="rgba(17,26,74,0.07)"/>
          <text x="136" y="144" fill="#111a4a" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">LỚP 1</text>
          <text x="112" y="168" fill="#111a4a" font-size="12" font-family="'Be Vietnam Pro', sans-serif" font-weight="600">Cảnh báo mềm</text>
          <text x="112" y="188" fill="#5b5e68" font-size="9" font-family="'JetBrains Mono', monospace">SOFT_WARNING · 1 nguồn · 72h</text>
        </g>

        <!-- PENDING_CHECKER -->
        <g>
          <rect x="376" y="124" width="196" height="80" rx="8" fill="#f6f6f8"/>
          <rect x="376" y="124" width="196" height="80" rx="8" fill="#ffffff" stroke="#111a4a" stroke-width="1.2"/>
          <rect x="388" y="134" width="48" height="14" rx="2" fill="rgba(17,26,74,0.07)"/>
          <text x="412" y="144" fill="#111a4a" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">LỚP 2A</text>
          <text x="388" y="168" fill="#111a4a" font-size="12" font-family="'Be Vietnam Pro', sans-serif" font-weight="600">Chờ người duyệt</text>
          <text x="388" y="188" fill="#5b5e68" font-size="9" font-family="'JetBrains Mono', monospace">PENDING_CHECKER · Maker gửi</text>
        </g>

        <!-- ACTIVE [FOCAL] -->
        <g>
          <rect x="668" y="124" width="212" height="80" rx="8" fill="#f6f6f8"/>
          <rect x="668" y="124" width="212" height="80" rx="8" fill="#fdf0e9" stroke="#c2410c" stroke-width="1.8"/>
          <rect x="680" y="134" width="48" height="14" rx="2" fill="#c2410c"/>
          <text x="704" y="144" fill="#ffffff" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">LỚP 2B</text>
          <text x="680" y="168" fill="#c2410c" font-size="12" font-family="'Be Vietnam Pro', sans-serif" font-weight="700">Đang hiệu lực (ACTIVE)</text>
          <text x="680" y="188" fill="#3b3e47" font-size="9" font-family="'JetBrains Mono', monospace">≥2 nguồn · Checker ≠ Maker</text>
        </g>

        <!-- EXPIRED -->
        <g>
          <rect x="376" y="316" width="196" height="72" rx="8" fill="#f6f6f8"/>
          <rect x="376" y="316" width="196" height="72" rx="8" fill="#ffffff" stroke="#111a4a" stroke-width="1.2"/>
          <rect x="388" y="326" width="48" height="14" rx="2" fill="rgba(17,26,74,0.07)"/>
          <text x="412" y="336" fill="#111a4a" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">LỚP 3</text>
          <text x="388" y="360" fill="#111a4a" font-size="12" font-family="'Be Vietnam Pro', sans-serif" font-weight="600">Hết hạn (EXPIRED)</text>
          <text x="388" y="376" fill="#5b5e68" font-size="9" font-family="'JetBrains Mono', monospace">Không treo cảnh báo vĩnh viễn</text>
        </g>

        <!-- ROLLED_BACK -->
        <g>
          <rect x="680" y="316" width="200" height="72" rx="8" fill="#f6f6f8"/>
          <rect x="680" y="316" width="200" height="72" rx="8" fill="#ffffff" stroke="#13705f" stroke-width="1.5"/>
          <rect x="692" y="326" width="68" height="14" rx="2" fill="#e8f6f1"/>
          <text x="726" y="336" fill="#13705f" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">LỚP 4</text>
          <text x="692" y="360" fill="#111a4a" font-size="12" font-family="'Be Vietnam Pro', sans-serif" font-weight="600">Đã thu hồi (ROLLED_BACK)</text>
          <text x="692" y="376" fill="#5b5e68" font-size="9" font-family="'JetBrains Mono', monospace">Gỡ cảnh báo · Lưu AuditLog</text>
        </g>

        <!-- LEGEND STRIP -->
        <line x1="32" y1="488" x2="928" y2="488" stroke="rgba(17,26,74,0.12)" stroke-width="1"/>
        <rect x="32" y="504" width="14" height="14" rx="3" fill="#fdf0e9" stroke="#c2410c" stroke-width="1.5"/>
        <text x="54" y="515" fill="#3b3e47" font-size="10" font-family="'Be Vietnam Pro', sans-serif">Trạng thái ACTIVE đồng bộ B2C (cần ≥2 nguồn &amp; Maker ≠ Checker)</text>

        <rect x="456" y="504" width="14" height="14" rx="3" fill="#ffffff" stroke="#13705f" stroke-width="1.5"/>
        <text x="478" y="515" fill="#3b3e47" font-size="10" font-family="'Be Vietnam Pro', sans-serif">Thu hồi tức thì bởi Checker độc lập (theo hướng TT 53/2026)</text>
      </svg>
    </div>
  </div>
</body>
</html>
