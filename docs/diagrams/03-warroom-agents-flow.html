<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng Điều phối 4 Agent Có Phản biện — MoMo TrustLoop v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&subset=vietnamese&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f6f6f8;
      --color-paper-2: #ffffff;
      --color-ink:     #111a4a;
      --color-muted:   #5b5e68;
      --color-soft:    #3b3e47;
      --color-accent:  #c2410c;
      --color-link:    #0b57d0;
      --font-sans:     'Be Vietnam Pro', system-ui, sans-serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.2vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">PROCESS · B2E FINCRIME WAR-ROOM</p>
    <h1>Điều phối Song song 4 Agent &amp; Phản biện Chống Khóa Oan</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="warroom-flow-title warroom-flow-desc">
        <title id="warroom-flow-title">Luồng 4 Agent War-Room có Phản biện</title>
        <desc id="warroom-flow-desc">Dữ liệu hồ sơ đã ẩn PII được phân tích song song bởi 4 Agent chuyên biệt, tổng hợp tranh biện qua rào chắn tối thiểu 2 nguồn trước khi con người phê duyệt.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#5b5e68"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#c2410c"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#0b57d0"/>
          </marker>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(17,26,74,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f6f6f8"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- ZONES -->
        <rect x="272" y="28" width="256" height="420" rx="8" fill="rgba(17,26,74,0.02)" stroke="rgba(17,26,74,0.12)" stroke-width="1"/>
        <rect x="312" y="20" width="176" height="16" rx="2" fill="#f6f6f8"/>
        <text x="400" y="31" fill="#3b3e47" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">PROMISE.ALLSETTLED (4 AGENTS)</text>

        <!-- CONNECTORS (drawn before nodes) -->
        <!-- Input (right edge x=216, y=220..268) fanned to 4 agents (left edge x=292) -->
        <!-- Fan 1 -> GraphTracer (y=96) -->
        <path d="M 216,220 H 240 Q 248,220 248,212 V 104 Q 248,96 256,96 H 292" fill="none" stroke="#5b5e68" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Fan 2 -> EvidenceCorrelator (y=192) -->
        <path d="M 216,236 H 244 Q 252,236 252,228 V 200 Q 252,192 260,192 H 292" fill="none" stroke="#5b5e68" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Fan 3 -> ComplianceRAG (y=288) -->
        <path d="M 216,252 H 244 Q 252,252 252,260 V 280 Q 252,288 260,288 H 292" fill="none" stroke="#5b5e68" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Fan 4 -> FalsePositiveDefender (y=384) [accent] -->
        <path d="M 216,268 H 240 Q 248,268 248,276 V 376 Q 248,384 256,384 H 292" fill="none" stroke="#c2410c" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 4 Agents (right edge x=508) -> DebateSynthesizer (left edge x=576, y=168..216) -->
        <path d="M 508,96 H 540 Q 548,96 548,104 V 164 Q 548,172 556,172 H 576" fill="none" stroke="#5b5e68" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="508" y1="192" x2="576" y2="192" stroke="#5b5e68" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 508,288 H 540 Q 548,288 548,280 V 220 Q 548,212 556,212 H 576" fill="none" stroke="#5b5e68" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- FP Defender -> DebateSynthesizer (bottom entry x=656, y=236) -->
        <path d="M 508,384 H 648 Q 656,384 656,376 V 236" fill="none" stroke="#c2410c" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="548" y="368" width="84" height="14" rx="2" fill="#f6f6f8"/>
        <text x="590" y="378" fill="#c2410c" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BIỆN HỘ FP</text>

        <!-- DebateSynthesizer -> Deterministic Guardrail (right to next column) -->
        <line x1="736" y1="192" x2="776" y2="192" stroke="#0b57d0" stroke-width="1.3" marker-end="url(#arrow-link)"/>
        <rect x="740" y="172" width="32" height="14" rx="2" fill="#f6f6f8"/>
        <text x="756" y="182" fill="#0b57d0" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">ZOD</text>

        <!-- Deterministic Guardrail -> Maker HITL (vertical down) -->
        <line x1="852" y1="236" x2="852" y2="304" stroke="#5b5e68" stroke-width="1.3" marker-end="url(#arrow)"/>
        <rect x="808" y="262" width="88" height="14" rx="2" fill="#f6f6f8"/>
        <text x="852" y="272" fill="#5b5e68" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHỈ ĐỀ XUẤT</text>

        <!-- NODES -->
        <!-- Input Node -->
        <g>
          <rect x="32" y="204" width="184" height="80" rx="6" fill="#f6f6f8"/>
          <rect x="32" y="204" width="184" height="80" rx="6" fill="#ffffff" stroke="#111a4a" stroke-width="1.3"/>
          <rect x="44" y="214" width="60" height="14" rx="2" fill="rgba(17,26,74,0.07)"/>
          <text x="74" y="224" fill="#111a4a" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">INPUT CASE</text>
          <text x="44" y="248" fill="#111a4a" font-size="12" font-family="'Be Vietnam Pro', sans-serif" font-weight="600">Hồ sơ &amp; Đồ thị Tiền</text>
          <text x="44" y="266" fill="#5b5e68" font-size="9" font-family="'JetBrains Mono', monospace">0 PII · Chia nhỏ &lt;10M</text>
        </g>

        <!-- 4 Parallel Agents -->
        <g>
          <rect x="292" y="64" width="216" height="64" rx="6" fill="#f6f6f8"/>
          <rect x="292" y="64" width="216" height="64" rx="6" fill="#ffffff" stroke="#111a4a" stroke-width="1.2"/>
          <text x="304" y="90" fill="#111a4a" font-size="12" font-family="'Be Vietnam Pro', sans-serif" font-weight="600">1. GraphTracer</text>
          <text x="304" y="108" fill="#5b5e68" font-size="9" font-family="'JetBrains Mono', monospace">Cụm ví mule · Thiết bị chung</text>
        </g>

        <g>
          <rect x="292" y="160" width="216" height="64" rx="6" fill="#f6f6f8"/>
          <rect x="292" y="160" width="216" height="64" rx="6" fill="#ffffff" stroke="#111a4a" stroke-width="1.2"/>
          <text x="304" y="186" fill="#111a4a" font-size="12" font-family="'Be Vietnam Pro', sans-serif" font-weight="600">2. EvidenceCorrelator</text>
          <text x="304" y="204" fill="#5b5e68" font-size="9" font-family="'JetBrains Mono', monospace">Đối chiếu chứng cứ Phút 00</text>
        </g>

        <g>
          <rect x="292" y="256" width="216" height="64" rx="6" fill="#f6f6f8"/>
          <rect x="292" y="256" width="216" height="64" rx="6" fill="#ffffff" stroke="#111a4a" stroke-width="1.2"/>
          <text x="304" y="282" fill="#111a4a" font-size="12" font-family="'Be Vietnam Pro', sans-serif" font-weight="600">3. ComplianceRAG</text>
          <text x="304" y="300" fill="#5b5e68" font-size="9" font-family="'JetBrains Mono', monospace">BM25 · 13 chunk luật VN 2026</text>
        </g>

        <g>
          <rect x="292" y="352" width="216" height="68" rx="6" fill="#f6f6f8"/>
          <rect x="292" y="352" width="216" height="68" rx="6" fill="#fdf0e9" stroke="#c2410c" stroke-width="1.8"/>
          <text x="304" y="378" fill="#c2410c" font-size="12" font-family="'Be Vietnam Pro', sans-serif" font-weight="700">4. FalsePositiveDefender</text>
          <text x="304" y="398" fill="#3b3e47" font-size="9" font-family="'JetBrains Mono', monospace">Minh oan tiểu thương (CASE-03)</text>
        </g>

        <!-- DebateSynthesizer -->
        <g>
          <rect x="576" y="148" width="160" height="88" rx="6" fill="#f6f6f8"/>
          <rect x="576" y="148" width="160" height="88" rx="6" fill="#ffffff" stroke="#111a4a" stroke-width="1.2"/>
          <rect x="588" y="158" width="56" height="14" rx="2" fill="rgba(17,26,74,0.07)"/>
          <text x="616" y="168" fill="#111a4a" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">STEP 5</text>
          <text x="588" y="192" fill="#111a4a" font-size="12" font-family="'Be Vietnam Pro', sans-serif" font-weight="600">DebateSynthesizer</text>
          <text x="588" y="212" fill="#5b5e68" font-size="9" font-family="'JetBrains Mono', monospace">Tranh biện + Thẻ CSKH</text>
        </g>

        <!-- Deterministic Guardrail -->
        <g>
          <rect x="776" y="148" width="152" height="88" rx="6" fill="#f6f6f8"/>
          <rect x="776" y="148" width="152" height="88" rx="6" fill="#ffffff" stroke="#0b57d0" stroke-width="1.5"/>
          <rect x="788" y="158" width="68" height="14" rx="2" fill="rgba(11,87,208,0.10)"/>
          <text x="822" y="168" fill="#0b57d0" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">CODE GUARD</text>
          <text x="788" y="192" fill="#111a4a" font-size="12" font-family="'Be Vietnam Pro', sans-serif" font-weight="600">Khóa &gt;=2 Nguồn</text>
          <text x="788" y="212" fill="#5b5e68" font-size="9" font-family="'JetBrains Mono', monospace">Chặn AI tự khóa ví</text>
        </g>

        <!-- Maker HITL -->
        <g>
          <rect x="776" y="304" width="152" height="88" rx="6" fill="#f6f6f8"/>
          <rect x="776" y="304" width="152" height="88" rx="6" fill="#ffffff" stroke="#111a4a" stroke-width="1.4"/>
          <rect x="788" y="314" width="64" height="14" rx="2" fill="#e8f6f1"/>
          <text x="820" y="324" fill="#13705f" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">HUMAN HITL</text>
          <text x="788" y="348" fill="#111a4a" font-size="12" font-family="'Be Vietnam Pro', sans-serif" font-weight="600">Maker Phê duyệt</text>
          <text x="788" y="368" fill="#5b5e68" font-size="9" font-family="'JetBrains Mono', monospace">Đề xuất · Minh oan · STR</text>
        </g>

        <!-- LEGEND STRIP -->
        <line x1="32" y1="484" x2="928" y2="484" stroke="rgba(17,26,74,0.12)" stroke-width="1"/>
        <rect x="32" y="500" width="14" height="14" rx="3" fill="#fdf0e9" stroke="#c2410c" stroke-width="1.5"/>
        <text x="54" y="511" fill="#3b3e47" font-size="10" font-family="'Be Vietnam Pro', sans-serif">Agent phản biện chống khóa oan (Signal Orange)</text>

        <rect x="364" y="500" width="14" height="14" rx="3" fill="#ffffff" stroke="#0b57d0" stroke-width="1.5"/>
        <text x="386" y="511" fill="#3b3e47" font-size="10" font-family="'Be Vietnam Pro', sans-serif">Rào chắn code cứng (Zod + &gt;=2 nguồn độc lập)</text>

        <text x="688" y="511" fill="#5b5e68" font-size="9" font-family="'JetBrains Mono', monospace">1 agent lỗi -&gt; AGENT_DEGRADED (cô lập)</text>
      </svg>
    </div>
  </div>
</body>
</html>
